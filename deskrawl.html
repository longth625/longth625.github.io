<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>桌面破坏神 · 构筑器 / Build Planner</title>
<style>
:root{
  --bg-deep:#060404; --bg-dark:#0d0806; --bg-card:rgba(24,16,12,.86); --bg-card2:rgba(32,21,15,.9);
  --border:rgba(201,162,39,.20); --border-bright:hsla(45,73%,66%,.55);
  --gold:#d4af37; --gold-light:#f0d68a; --cyan:#c9a227; --text:#cfc0a4; --text-bright:#f0e6d0; --muted:#8a7a5c;
  --l-common:#9a9a9a; --l-uncommon:#4cd964; --l-rare:#4a90d9; --l-epic:#a05ad9; --l-legendary:#d4af37; --l-divine:#ff3b3b;
  --ok:#4cd964; --warn:#e8a33d; --bad:#ff5c5c;
  --slotbg:rgba(10,7,5,.6);
}
html[data-theme="light"]{
  --bg-deep:#f4efe6; --bg-dark:#fbf8f2; --bg-card:rgba(255,255,255,.92); --bg-card2:rgba(250,246,238,.95);
  --border:rgba(140,110,50,.25); --border-bright:rgba(150,115,45,.55);
  --gold:#96742a; --gold-light:#7a5d1e; --cyan:#8a6b20; --text:#43382a; --text-bright:#241d12; --muted:#8b7c65;
  --l-common:#7a7a7a; --l-uncommon:#2e9e4a; --l-rare:#2c6fb5; --l-epic:#7d3fb5; --l-legendary:#a8841f; --l-divine:#d32b2b;
  --slotbg:rgba(0,0,0,.03);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
  background:var(--bg-deep);color:var(--text);font-size:14px;line-height:1.55}
html[data-theme="dark"] body{background:
  radial-gradient(ellipse 80% 50% at 50% 0,rgba(179,24,31,.13) 0,transparent 60%),
  radial-gradient(ellipse 60% 40% at 82% 100%,rgba(120,40,20,.10) 0,transparent 60%),
  linear-gradient(180deg,#060404,#0d0806 50%,#060404);background-attachment:fixed}
a{color:var(--gold-light)}

/* ---------- 顶栏 ---------- */
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(8px);
  background:color-mix(in srgb,var(--bg-deep) 88%,transparent);border-bottom:1px solid var(--border)}
.topbar{max-width:1680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-size:17px;font-weight:700;color:var(--text-bright);letter-spacing:.5px;white-space:nowrap}
.brand i{color:var(--gold);font-style:normal}
.brand small{display:block;font-size:11px;font-weight:400;color:var(--muted);letter-spacing:0}
.spacer{flex:1}

.clsbar{display:flex;gap:6px;flex-wrap:wrap}
.clsbtn{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:var(--bg-card);
  color:var(--text);cursor:pointer;font-size:13px;transition:.15s;font-family:inherit}
.clsbtn:hover{border-color:var(--border-bright);color:var(--text-bright)}
.clsbtn.on{border-color:var(--gold);background:linear-gradient(180deg,rgba(212,175,55,.22),rgba(212,175,55,.06));
  color:var(--text-bright);font-weight:700;box-shadow:0 0 12px rgba(212,175,55,.18)}

button.tb{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg-card);
  color:var(--text);cursor:pointer;font-size:13px;font-family:inherit;transition:.15s;white-space:nowrap}
button.tb:hover{border-color:var(--border-bright);color:var(--text-bright)}
button.tb.pri{border-color:var(--gold);color:var(--gold-light)}
button.tb.danger:hover{border-color:var(--bad);color:var(--bad)}
select,input,textarea{font-family:inherit;background:var(--slotbg);color:var(--text);
  border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px;outline:none}
select:focus,input:focus{border-color:var(--gold)}
select option{background:#171310;color:#cfc0a4}
html[data-theme="light"] select option{background:#fff;color:#43382a}

/* ---------- 布局 ---------- */
.wrap{max-width:1680px;margin:0 auto;padding:14px 16px 60px;
  display:grid;grid-template-columns:340px minmax(420px,1fr) 400px;gap:14px;align-items:start}
@media (max-width:1400px){.wrap{grid-template-columns:300px minmax(360px,1fr) 340px}}
@media (max-width:1150px){.wrap{grid-template-columns:1fr}}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.card+.card{margin-top:14px}
.card>h2{margin:0;padding:9px 13px;font-size:13px;font-weight:700;color:var(--gold-light);
  letter-spacing:.6px;border-bottom:1px solid var(--border);background:var(--bg-card2);
  display:flex;align-items:center;gap:8px}
.card>h2 .hint{margin-left:auto;font-size:11px;font-weight:400;color:var(--muted);letter-spacing:0}
.pad{padding:12px}

/* ---------- 装备栏 ---------- */
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.slot{position:relative;display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;
  border:1px solid var(--border);background:var(--slotbg);cursor:pointer;transition:.15s;min-height:54px}
.slot:hover{border-color:var(--border-bright)}
.slot.sel{border-color:var(--gold);box-shadow:0 0 0 1px rgba(212,175,55,.35),0 0 14px rgba(212,175,55,.14)}
.slot.filled{background:var(--bg-card2)}
.slot .ic{width:40px;height:40px;flex:0 0 40px;border-radius:6px;background:rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--border)}
.slot .ic img{width:100%;height:100%;object-fit:contain;image-rendering:auto}
.slot .ic .ph{font-size:17px;color:var(--muted);opacity:.5}
.slot .meta{min-width:0;flex:1}
.slot .lb{font-size:10px;color:var(--muted);letter-spacing:.5px}
.slot .nm{font-size:12.5px;font-weight:600;color:var(--text-bright);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;line-height:1.3}
.slot .af{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .x{position:absolute;top:3px;right:4px;font-size:12px;color:var(--muted);opacity:0;transition:.15s;
  width:16px;height:16px;line-height:15px;text-align:center;border-radius:4px}
.slot:hover .x{opacity:1}
.slot .x:hover{background:rgba(255,92,92,.18);color:var(--bad)}

/* ---------- 选择器 ---------- */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--bg-card2)}
.tab{padding:9px 16px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;
  transition:.15s;font-family:inherit;background:none;border-top:0;border-left:0;border-right:0}
.tab:hover{color:var(--text)}
.tab.on{color:var(--gold-light);border-bottom-color:var(--gold);font-weight:700}
.tab:disabled{opacity:.35;cursor:not-allowed}
.filters{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.filters input[type=text]{flex:1;min-width:130px}
.qchips{display:flex;gap:4px;flex-wrap:wrap}
.qchip{padding:3px 9px;border-radius:99px;font-size:11.5px;border:1px solid var(--border);
  background:transparent;color:var(--muted);cursor:pointer;font-family:inherit;transition:.15s}
.qchip.on{color:var(--text-bright);border-color:currentColor;background:rgba(255,255,255,.04)}
html[data-theme="light"] .qchip.on{background:rgba(0,0,0,.05)}
ul.items{list-style:none;margin:0;padding:8px;display:grid;gap:6px;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));max-height:calc(100vh - 300px);overflow:auto}
ul.items li{display:flex;gap:9px;align-items:center;padding:6px 8px;border-radius:8px;
  border:1px solid var(--border);background:var(--slotbg);cursor:pointer;transition:.12s}
ul.items li:hover{border-color:var(--border-bright);background:var(--bg-card2)}
ul.items li.cur{border-color:var(--gold);background:linear-gradient(90deg,rgba(212,175,55,.16),transparent)}
ul.items li img{width:36px;height:36px;flex:0 0 36px;object-fit:contain;
  background:rgba(0,0,0,.3);border-radius:6px;border:1px solid var(--border)}
ul.items li .t{min-width:0}
ul.items li .n{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
ul.items li .e{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
ul.items li .d{font-size:11px;color:var(--text);opacity:.8;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:13px}

/* ---------- 词条编辑 ---------- */
.afxhead{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center}
.afxhead img{width:40px;height:40px;object-fit:contain;background:rgba(0,0,0,.3);border-radius:6px;border:1px solid var(--border)}
.afxbody{padding:10px 12px;max-height:calc(100vh - 330px);overflow:auto}
.grp{font-size:11px;color:var(--muted);letter-spacing:1px;margin:10px 0 6px;border-bottom:1px dashed var(--border);padding-bottom:3px}
.grp:first-child{margin-top:0}
.afxrow{display:grid;grid-template-columns:1fr 96px;gap:8px;align-items:center;padding:5px 6px;border-radius:6px}
.afxrow:hover{background:rgba(255,255,255,.03)}
html[data-theme="light"] .afxrow:hover{background:rgba(0,0,0,.03)}
.afxrow.dis{opacity:.42}
.afxrow label{display:flex;gap:7px;align-items:center;cursor:pointer;min-width:0}
.afxrow input[type=checkbox]{accent-color:var(--gold);cursor:pointer;flex:0 0 auto}
.afxrow .an{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.afxrow .ar{font-size:10.5px;color:var(--muted)}
.afxrow input[type=number]{width:100%;text-align:right;padding:3px 6px}
.bar{height:4px;border-radius:2px;background:var(--slotbg);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold))}

/* ---------- 总计 ---------- */
.totals{padding:10px 12px;max-height:calc(100vh - 150px);overflow:auto}
.tgrp{margin-bottom:12px}
.tgrp>h3{margin:0 0 5px;font-size:11.5px;color:var(--gold-light);letter-spacing:1px;
  border-bottom:1px solid var(--border);padding-bottom:3px;display:flex;gap:6px;align-items:baseline}
.tgrp>h3 em{margin-left:auto;font-style:normal;font-size:10.5px;color:var(--muted)}
.trow{display:flex;align-items:baseline;gap:8px;padding:2.5px 0;font-size:12.5px}
.trow .k{color:var(--text);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .v{font-weight:700;color:var(--text-bright);font-variant-numeric:tabular-nums;white-space:nowrap}
.trow.hi .v{color:var(--gold-light)}
.trow.zero{opacity:.32}
.statbar{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.statbar b{color:var(--text-bright);font-weight:700}
.warnbox{margin:10px 12px;padding:8px 10px;border-radius:8px;border:1px solid rgba(232,163,61,.4);
  background:rgba(232,163,61,.08);font-size:11.5px;color:var(--text)}
.warnbox b{color:var(--warn)}
.fbnote{margin:0 0 4px;padding:7px 9px;border-radius:7px;border:1px solid rgba(232,163,61,.4);
  background:rgba(232,163,61,.08);font-size:11px;color:var(--muted);line-height:1.5}
[data-theme="light"] .fbnote{color:#6b5a2f}

/* ---------- BD 信息卡 ---------- */
.bdinfo{padding:11px 13px;font-size:12.5px;max-height:320px;overflow:auto}
.bdinfo h4{margin:0 0 4px;font-size:14px;color:var(--text-bright)}
.bdinfo .tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;border:1px solid var(--border);
  color:var(--muted);margin:0 4px 6px 0}
.bdinfo p{margin:6px 0;color:var(--text)}
.bdinfo .lbl{color:var(--gold-light);font-size:11px;letter-spacing:.5px;display:block;margin-top:8px}
.bdinfo ul{margin:3px 0 0;padding-left:18px}
.bdinfo li{margin:1px 0}
.bdinfo .src{font-size:11px;color:var(--muted);word-break:break-all}

/* ---------- 弹层 ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.mask.on{display:flex}
.modal{background:var(--bg-dark);border:1px solid var(--border-bright);border-radius:12px;max-width:760px;width:100%;
  max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal h3{margin:0;padding:12px 16px;border-bottom:1px solid var(--border);font-size:14px;color:var(--gold-light)}
.modal .body{padding:14px 16px}
.modal .foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.bdlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.bdlist li{border:1px solid var(--border);border-radius:8px;padding:9px 11px;display:flex;gap:10px;align-items:center}
.bdlist li .g{flex:1;min-width:0}
.bdlist li .n{font-weight:700;color:var(--text-bright);font-size:13px}
.bdlist li .s{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
textarea.io{width:100%;height:190px;font-family:ui-monospace,Consolas,monospace;font-size:12px;resize:vertical}
.note{font-size:11.5px;color:var(--muted);margin-top:6px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--bg-card2);border:1px solid var(--gold);color:var(--text-bright);padding:9px 18px;border-radius:99px;
  font-size:13px;transition:.25s;pointer-events:none;z-index:200}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
footer{max-width:1680px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:11.5px}
.datanotes{margin-top:10px;padding-top:9px;border-top:1px dashed var(--border);line-height:1.7}
.datanotes b{color:var(--warn);font-weight:700}
</style>
</head>
<body>

<header>
  <div class="topbar">
    <div class="brand"><i>⚔</i> 桌面破坏神 · 构筑器<small>Deskrawl Build Planner · 离线版</small></div>
    <div class="clsbar" id="clsbar"></div>
    <div class="spacer"></div>
    <select id="presetSel" title="载入预设 BD"></select>
    <button class="tb" id="btnLoadPreset">载入预设</button>
    <button class="tb pri" id="btnSave">保存 BD</button>
    <button class="tb" id="btnMine">我的 BD</button>
    <button class="tb" id="btnImport">导入</button>
    <button class="tb" id="btnExport">导出</button>
    <button class="tb danger" id="btnClear">清空</button>
    <button class="tb" id="btnTheme" title="切换主题">◐</button>
  </div>
</header>

<div class="wrap">

  <!-- 左：装备栏 -->
  <div>
    <div class="card">
      <h2>装备栏<span class="hint" id="slotHint">点击栏位选择装备</span></h2>
      <div class="slots" id="slots"></div>
    </div>
    <div class="card">
      <h2>仆从<span class="hint">可选</span></h2>
      <div class="pad">
        <select id="minionSel" style="width:100%"></select>
      </div>
    </div>
  </div>

  <!-- 中：选择器 / 词条 -->
  <div class="card">
    <div class="tabs">
      <button class="tab on" id="tabPick" data-tab="pick">选择装备</button>
      <button class="tab" id="tabAfx" data-tab="afx" disabled>添加词条</button>
    </div>

    <div id="panePick">
      <div class="filters">
        <div style="font-size:12px;color:var(--gold-light);font-weight:700" id="pickSlotName">请选择栏位</div>
        <div class="spacer" style="flex:1"></div>
        <input type="text" id="q" placeholder="搜索中/英文名称…">
      </div>
      <div class="filters" style="padding-top:0;border-bottom:1px solid var(--border)">
        <div class="qchips" id="qchips"></div>
        <div class="spacer" style="flex:1"></div>
        <label style="font-size:11.5px;color:var(--muted);display:flex;gap:5px;align-items:center">
          <input type="checkbox" id="onlyPool"> 仅掉落池
        </label>
      </div>
      <ul class="items" id="itemList"></ul>
    </div>

    <div id="paneAfx" style="display:none">
      <div class="afxhead" id="afxHead"></div>
      <div class="afxbody" id="afxBody"></div>
    </div>
  </div>

  <!-- 右：总数据 -->
  <div>
    <div class="card">
      <h2>总数据<span style="margin-left:auto;display:flex;gap:8px;align-items:center">
        <button class="tb" id="btnShowAll" style="padding:2px 8px;font-size:11px">显示全部属性</button>
        <span class="hint" id="totHint" style="margin-left:0"></span></span></h2>
      <div class="statbar" id="statbar"></div>
      <div class="totals" id="totals"></div>
    </div>
    <div class="card">
      <h2>当前 BD 信息<span class="hint" id="bdHint"></span></h2>
      <div class="bdinfo" id="bdinfo"></div>
    </div>
  </div>
</div>

<footer>
  数据来源：<a href="https://deskrawl.top" target="_blank" rel="noopener">deskrawl.top</a>（玩家自建非官方 Wiki，数据快照 2026-09-28）·
  BD 来自游民星空 / Steam 社区 / 官方论坛公开攻略 · 本工具为个人整理的离线构筑模拟器，数值以游戏内为准。
  <div id="datanotes" class="datanotes"></div>
</footer>

<!-- 模态：我的BD -->
<div class="mask" id="maskMine"><div class="modal">
  <h3>我的 BD（保存在本机浏览器）</h3>
  <div class="body"><ul class="bdlist" id="mineList"></ul>
    <div class="note" id="mineNote"></div></div>
  <div class="foot"><button class="tb" data-close>关闭</button></div>
</div></div>

<!-- 模态：导入导出 -->
<div class="mask" id="maskIO"><div class="modal">
  <h3 id="ioTitle">BD 数据</h3>
  <div class="body">
    <textarea class="io" id="ioText" spellcheck="false"></textarea>
    <div class="note" id="ioNote"></div>
  </div>
  <div class="foot">
    <button class="tb" id="ioCopy">复制到剪贴板</button>
    <button class="tb pri" id="ioApply">应用</button>
    <button class="tb" data-close>关闭</button>
  </div>
</div></div>

<!-- 模态：保存命名 -->
<div class="mask" id="maskSave"><div class="modal" style="max-width:460px">
  <h3>保存为我的 BD</h3>
  <div class="body">
    <input type="text" id="saveName" placeholder="给这套 BD 起个名字…" style="width:100%">
    <div class="note">保存在本机浏览器 localStorage，不会上传。</div>
  </div>
  <div class="foot"><button class="tb" data-close>取消</button>
    <button class="tb pri" id="saveOk">保存</button></div>
</div></div>

<div class="toast" id="toast"></div>

/* ============ 状态 ============ */
let ST = newState();
let curSlot = SLOTS[0].key;
let curTab = 'pick';
let filters = {q:'', quals:new Set(QORDER), pool:false, showAll:false};

function newState(){ return {cls:'Warrior', slots:{}, minion:'', presetId:null, name:''}; }
function slotDef(k){ return SLOTS.find(s=>s.key===k); }
function gearById(id){ return DB.gearIndex[id]; }

/* ============ 工具 ============ */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function icon(path, alt){
  const src = path && DB.icons[path];
  if(src) return `<img src="${src}" alt="${esc(alt||'')}" loading="lazy">`;
  return `<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:var(--muted);opacity:.45;font-size:16px">◆</div>`;
}
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800);
}
function affixOf(id){ return DB.affixes[id]; }
function affixLabel(id){ const a=affixOf(id); return a ? (a.name||id) : id; }
function affixText(id,val){
  const a=affixOf(id); if(!a) return '';
  const tpl = a.desc || ('+{value} '+(a.name||id));
  return tpl.replace('{value}', fmtNum(val));
}
function fmtNum(v){ return Math.round(v*100)/100; }

/* ============ 顶栏：职业 ============ */
function renderClasses(){
  document.getElementById('clsbar').innerHTML = DB.classes.map(c=>
    `<button class="clsbtn ${ST.cls===c.key?'on':''}" data-cls="${c.key}">${esc(c.cn)}</button>`).join('');
}
document.getElementById('clsbar').addEventListener('click', e=>{
  const b=e.target.closest('[data-cls]'); if(!b) return;
  ST.cls=b.dataset.cls; renderClasses(); renderAll();
});

/* ============ 装备栏 ============ */
function renderSlots(){
  document.getElementById('slots').innerHTML = SLOTS.map(s=>{
    const eq = ST.slots[s.key];
    const g = eq ? gearById(eq.gearId) : null;
    const nAf = eq ? (eq.affixes||[]).filter(a=>a.id && a.value!=null).length : 0;
    return `<div class="slot ${curSlot===s.key?'sel':''} ${g?'filled':''}" data-slot="${s.key}"
       title="${g?esc(g.name):'未装备'}">
      <div class="ic">${g ? icon(g.icon,g.name) : `<div class="ph">＋</div>`}</div>
      <div class="meta">
        <div class="lb">${esc(s.cn)}</div>
        <div class="nm" style="${g?'color:'+QCOLOR[g.quality]:''}">${g?esc(g.name):'— 空 —'}</div>
        <div class="af">${g?esc(g.qualityName)+' · 词条 '+nAf+'/'+QMAX[g.quality]:'点击装备'}</div>
      </div>
      ${g?`<div class="x" data-clear="${s.key}" title="卸下">✕</div>`:''}
    </div>`;
  }).join('');
}
document.getElementById('slots').addEventListener('click', e=>{
  const c=e.target.closest('[data-clear]');
  if(c){ e.stopPropagation(); delete ST.slots[c.dataset.clear]; renderAll(); return; }
  const s=e.target.closest('[data-slot]'); if(!s) return;
  curSlot=s.dataset.slot;
  if(!ST.slots[curSlot]) setTab('pick');
  renderAll();
});

/* ============ 选择器 ============ */
function renderQchips(){
  document.getElementById('qchips').innerHTML = QORDER.map(q=>{
    const c = DB.qualityMeta[q]||{};
    return `<button class="qchip ${filters.quals.has(q)?'on':''}" data-q="${q}"
      style="${filters.quals.has(q)?('color:'+QCOLOR[q]):''}">${esc(c.name||q)}</button>`;
  }).join('');
}
document.getElementById('qchips').addEventListener('click', e=>{
  const b=e.target.closest('[data-q]'); if(!b) return;
  const q=b.dataset.q;
  filters.quals.has(q) ? filters.quals.delete(q) : filters.quals.add(q);
  renderQchips(); renderItems();
});
document.getElementById('q').addEventListener('input', e=>{ filters.q=e.target.value.trim().toLowerCase(); renderItems(); });
document.getElementById('onlyPool').addEventListener('change', e=>{ filters.pool=e.target.checked; renderItems(); });
document.getElementById('btnShowAll').addEventListener('click', e=>{
  filters.showAll=!filters.showAll;
  e.target.textContent = filters.showAll? '只看生效项' : '显示全部属性';
  e.target.classList.toggle('pri', filters.showAll);
  renderTotals();
});

function renderItems(){
  const def=slotDef(curSlot);
  document.getElementById('pickSlotName').textContent = `${ST.clsCN||''} · ${def.cn}`;
  const eq = ST.slots[curSlot];
  let list = DB.gear.filter(g=>g.slot===def.type);
  list = list.filter(g=>filters.quals.has(g.quality));
  if(filters.pool) list = list.filter(g=>g.inDropPool);
  if(filters.q){
    const q=filters.q;
    list = list.filter(g=>(g.name&&g.name.toLowerCase().includes(q))||(g.nameEn&&g.nameEn.toLowerCase().includes(q))||(g.id&&g.id.toLowerCase().includes(q)));
  }
  list.sort((a,b)=>QORDER.indexOf(a.quality)-QORDER.indexOf(b.quality)||a.id.localeCompare(b.id));

  const ul=document.getElementById('itemList');
  if(!list.length){ ul.innerHTML=`<li style="grid-column:1/-1;border:0;background:none;cursor:default"><div class="empty">没有匹配的装备</div></li>`; return; }
  ul.innerHTML = list.map(g=>`<li data-gid="${g.id}" class="${eq&&eq.gearId===g.id?'cur':''}">
      ${icon(g.icon,g.name)}
      <div class="t">
        <div class="n" style="color:${QCOLOR[g.quality]}">${esc(g.name)}</div>
        <div class="e">${esc(g.nameEn||'')}</div>
        ${g.desc?`<div class="d">${esc(g.desc)}</div>`:''}
      </div>
    </li>`).join('');
}
document.getElementById('itemList').addEventListener('click', e=>{
  const li=e.target.closest('[data-gid]'); if(!li) return;
  const gid=li.dataset.gid; const g=gearById(gid); if(!g) return;
  const prev=ST.slots[curSlot];
  const keep = prev && prev.gearId===gid ? prev.affixes : [];
  ST.slots[curSlot]={gearId:gid, affixes:(keep||[]).slice(0, QMAX[g.quality])};
  toast('已装备：'+g.name);
  renderAll();
});

/* ============ 词条编辑 ============ */
function setTab(t){
  curTab=t;
  document.getElementById('tabPick').classList.toggle('on',t==='pick');
  document.getElementById('tabAfx').classList.toggle('on',t==='afx');
  document.getElementById('panePick').style.display = t==='pick'?'':'none';
  document.getElementById('paneAfx').style.display = t==='afx'?'':'none';
}
document.getElementById('tabPick').addEventListener('click', ()=>{ setTab('pick'); renderItems(); });
document.getElementById('tabAfx').addEventListener('click', ()=>{ if(!document.getElementById('tabAfx').disabled) { setTab('afx'); renderAffixEditor(); } });

function renderAffixEditor(){
  const def=slotDef(curSlot), eq=ST.slots[curSlot];
  const head=document.getElementById('afxHead'), body=document.getElementById('afxBody');
  if(!eq){ head.innerHTML=''; body.innerHTML='<div class="empty">该栏位还没有装备</div>'; return; }
  const g=gearById(eq.gearId);
  const max=QMAX[g.quality];
  const used=(eq.affixes||[]).filter(a=>a.id&&a.value!=null).length;
  head.innerHTML=`${icon(g.icon,g.name)}
    <div><div style="font-weight:700;color:${QCOLOR[g.quality]}">${esc(g.name)}</div>
    <div style="font-size:11.5px;color:var(--muted)">${esc(g.qualityName)} · 可roll词条 ${used}/${max}${
      used>=max?' <span style="color:var(--warn)">（已满）</span>':''}</div></div>`;

  const sa = DB.slotAffixes[def.type] || {prefix:[],suffix:[]};
  const cur = new Map((eq.affixes||[]).map(a=>[a.id,a.value]));
  const banner = sa.fallback
    ? `<div class="fbnote">Wiki 未收录「${esc(def.cn)}」部位的词条规则，此处兜底开放全部词条，请以游戏内为准。</div>`
    : '';
  const groups=[['前缀 / Prefix',sa.prefix||[]],['后缀 / Suffix',sa.suffix||[]]];
  body.innerHTML = banner + groups.map(([gn,ids])=>{
    if(!ids.length) return '';
    return `<div class="grp">${esc(gn)}</div>` + ids.map(id=>{
      const a=affixOf(id); if(!a) return '';
      const on=cur.has(id);
      const full = !on && used>=max;
      const v = on ? cur.get(id) : a.max;
      const untr = a.untranslated ? ' <span style="color:var(--warn);font-size:10px">(Wiki 未译)</span>' : '';
      return `<div class="afxrow ${on?'':'dis'}" data-afx="${id}">
        <label><input type="checkbox" ${on?'checked':''} ${full?'disabled':''}>
          <span><span class="an">${esc(a.name||id)}${untr}</span>
          <span class="ar"> ${a.min}–${a.max}${esc(a.unit||'')}</span></span></label>
        <div>
          <input type="number" min="${a.min}" max="${a.max}" step="${a.step||1}" value="${v}"
            ${on?'':'disabled'} data-afxnum="${id}">
          <div class="bar"><i style="width:${Math.max(0,Math.min(100,((v-a.min)/(a.max-a.min||1))*100))}%"></i></div>
        </div>
      </div>`;
    }).join('');
  }).join('');
}
document.getElementById('afxBody').addEventListener('change', e=>{
  const row=e.target.closest('[data-afx]'); if(!row) return;
  const id=row.dataset.afx, a=affixOf(id), eq=ST.slots[curSlot]; if(!eq||!a) return;
  eq.affixes = eq.affixes||[];
  if(e.target.type==='checkbox'){
    if(e.target.checked){
      const g=gearById(eq.gearId), max=QMAX[g.quality];
      if(eq.affixes.filter(x=>x.id&&x.value!=null).length>=max){ toast('词条已满，先取消一条'); e.target.checked=false; return; }
      eq.affixes.push({id, value:a.max});
    } else {
      eq.affixes = eq.affixes.filter(x=>x.id!==id);
    }
  } else if(e.target.dataset.afxnum){
    let v=parseFloat(e.target.value); if(isNaN(v)) v=a.min;
    v=Math.max(a.min, Math.min(a.max, v));
    const rec=eq.affixes.find(x=>x.id===id); if(rec) rec.value=v;
  }
  renderSlots(); renderAffixEditor(); renderTotals();
});

/* ============ 总数据 ============ */
function collectTotals(){
  const sum={};
  for(const k of Object.keys(ST.slots)){
    for(const a of (ST.slots[k].affixes||[])){
      if(!a.id||a.value==null) continue;
      sum[a.id]=(sum[a.id]||0)+Number(a.value);
    }
  }
  return sum;
}
function renderTotals(){
  const sum=collectTotals();
  const keys=Object.keys(sum).filter(k=>sum[k]>0);
  document.getElementById('totHint').textContent = keys.length ? `${keys.length} 项生效词条` : '暂无词条';

  const equipped=SLOTS.filter(s=>ST.slots[s.key]).length;
  const quals={};
  SLOTS.forEach(s=>{ const e=ST.slots[s.key]; if(e){ const g=gearById(e.gearId); if(g) quals[g.quality]=(quals[g.quality]||0)+1; } });
  const afTotal=SLOTS.reduce((n,s)=>n+((ST.slots[s.key]?.affixes||[]).filter(a=>a.id&&a.value!=null).length),0);
  document.getElementById('statbar').innerHTML =
    `职业 <b>${esc(ST.clsCN||'')}</b> · 已装备 <b>${equipped}/${SLOTS.length}</b> · 词条 <b>${afTotal}</b>` +
    QORDER.filter(q=>quals[q]).map(q=>` · <span style="color:${QCOLOR[q]}"><b style="color:inherit">${esc((DB.qualityMeta[q]||{}).name||q)} ${quals[q]}</b></span>`).join('');

  const showAll = filters.showAll;
  let html='';
  for(const cat of CATS){
    const rows=cat.ids.filter(id=>sum[id]>0).map(id=>{
      const a=affixOf(id); const v=sum[id];
      return `<div class="trow hi"><span class="k">${esc(a? (a.name||id):id)}</span><span class="v">${esc(affixText(id,v))}</span></div>`;
    });
    if(!rows.length){
      if(!showAll) continue;
      html+=`<div class="tgrp"><h3>${esc(cat.name)}<em>0</em></h3>
        ${cat.ids.slice(0,6).map(id=>`<div class="trow zero"><span class="k">${esc(affixLabel(id))}</span><span class="v">—</span></div>`).join('')}
        ${cat.ids.length>6?`<div class="trow zero"><span class="k">…其余 ${cat.ids.length-6} 项</span><span class="v"></span></div>`:''}</div>`;
      continue;
    }
    html+=`<div class="tgrp"><h3>${esc(cat.name)}<em>${rows.length} 项</em></h3>${rows.join('')}</div>`;
  }
  if(!html) html='<div class="empty">还没有词条。<br>点选装备后切到「添加词条」标签页填写。</div>';
  document.getElementById('totals').innerHTML=html;
}

/* ============ BD 信息卡 ============ */
function renderBdInfo(){
  const box=document.getElementById('bdinfo'), hint=document.getElementById('bdHint');
  const p = ST.presetId ? DB.presets.find(x=>x.id===ST.presetId) : null;
  const title = ST.name || (p? p.name : '自定义配装');
  hint.textContent = p? '来自预设' : (ST.name?'自定义':'空');
  if(!p){
    const cls=DB.classes.find(c=>c.key===ST.cls);
    const sk=DB.skillSummary[ST.cls];
    box.innerHTML=`<h4>${esc(title)}</h4>
      <span class="tag">${esc(cls?cls.cn:'')}</span><span class="tag">自定义</span>
      ${sk?`<span class="lbl">该职业技能树（wiki 已收录）</span>
      <p style="font-size:12px">技能 ${sk.abilities} 个 · 天赋节点 ${sk.talents} 个</p>`:
      `<span class="lbl">数据缺口</span><p style="font-size:12px">该职业的技能树尚未被 Wiki 收录。</p>`}
      <span class="lbl">提示</span>
      <p style="font-size:12px">点顶部「载入预设」可一键套用线上 BD；或自行配装后「保存 BD」留档。</p>`;
    return;
  }
  const src=(p.sources||[]).map(s=>`<div class="src">· ${esc(s.name)}${s.url?` — <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a>`:''}</div>`).join('');
  box.innerHTML=`<h4>${esc(p.name)}</h4>
    <span class="tag">${esc(p.className)}</span><span class="tag">${esc(p.archetype||'')}</span>${p.damageType?`<span class="tag">${esc(p.damageType)}</span>`:''}
    <p>${esc(p.summary||'')}</p>
    ${p.coreSkills&&p.coreSkills.length?`<span class="lbl">核心技能</span><ul>${p.coreSkills.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    ${p.keyTalents&&p.keyTalents.length?`<span class="lbl">关键天赋</span><ul>${p.keyTalents.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    ${p.minionsText?`<span class="lbl">仆从</span><p>${esc(p.minionsText)}</p>`:''}
    ${p.notes?`<span class="lbl">要点 / 坑</span><p>${esc(p.notes)}</p>`:''}
    ${src?`<span class="lbl">来源</span>${src}`:''}`;
}

/* ============ 仆从 ============ */
function renderMinions(){
  const sel=document.getElementById('minionSel');
  sel.innerHTML='<option value="">— 不选择 —</option>' +
    DB.minions.map(m=>`<option value="${esc(m.name)}" ${ST.minion===m.name?'selected':''}>${esc(m.name)}（${esc(m.qualityName||'')}）</option>`).join('');
}
document.getElementById('minionSel').addEventListener('change', e=>{ ST.minion=e.target.value; });

/* ============ 预设 BD ============ */
function renderPresetSel(){
  const sel=document.getElementById('presetSel');
  sel.innerHTML='<option value="">— 选择预设 BD —</option>' +
    DB.presets.map(p=>`<option value="${esc(p.id)}">${esc(p.className)} · ${esc(p.name)}</option>`).join('');
}
document.getElementById('btnLoadPreset').addEventListener('click', ()=>{
  const id=document.getElementById('presetSel').value;
  if(!id){ toast('请先选择一个预设 BD'); return; }
  const p=DB.presets.find(x=>x.id===id); if(!p) return;
  ST=newState();
  ST.cls=p.classKey; ST.presetId=p.id; ST.name=p.name;
  // 装备
  for(const [slot,gid] of Object.entries(p.gear||{})){
    if(!slotDef(slot) || !gearById(gid)) continue;
    ST.slots[slot]={gearId:gid, affixes:[]};
  }
  // 按词条优先级自动填满
  for(const s of SLOTS){
    const e=ST.slots[s.key]; if(!e) continue;
    const g=gearById(e.gearId), max=QMAX[g.quality];
    const sa=DB.slotAffixes[s.type]||{prefix:[],suffix:[]};
    const allowed=new Set([...(sa.prefix||[]),...(sa.suffix||[])]);
    const picked=[];
    for(const nm of (p.affixPriority||[])){
      const aid=DB.affixNameIndex[nm];
      if(aid && allowed.has(aid) && !picked.some(x=>x.id===aid)) picked.push({id:aid, value:DB.affixes[aid].max});
      if(picked.length>=max) break;
    }
    e.affixes=picked;
  }
  // 尝试匹配仆从
  if(p.minionsText){
    const hit=DB.minions.find(m=>p.minionsText.includes(m.name));
    ST.minion = hit? hit.name : '';
  }
  renderClasses(); renderMinions(); renderAll();
  toast('已载入：'+p.name);
});

/* ============ 我的 BD ============ */
function loadMine(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||'{}'); }catch(e){ return {}; } }
function saveMine(o){ localStorage.setItem(LS_KEY, JSON.stringify(o)); }

document.getElementById('btnSave').addEventListener('click', ()=>{
  document.getElementById('saveName').value = ST.name || '';
  openMask('maskSave');
  setTimeout(()=>document.getElementById('saveName').focus(),60);
});
document.getElementById('saveOk').addEventListener('click', ()=>{
  const nm=document.getElementById('saveName').value.trim() || ('未命名 BD '+new Date().toLocaleString());
  const all=loadMine();
  const id='my_'+Date.now().toString(36);
  all[id]={id, name:nm, savedAt:new Date().toISOString(), cls:ST.cls,
    slots:JSON.parse(JSON.stringify(ST.slots)), minion:ST.minion, presetId:ST.presetId};
  saveMine(all); ST.name=nm; closeMask('maskSave'); renderBdInfo();
  toast('已保存：'+nm);
});

function openMine(){
  const all=loadMine(); const arr=Object.values(all).sort((a,b)=>(b.savedAt||'').localeCompare(a.savedAt||''));
  const ul=document.getElementById('mineList');
  document.getElementById('mineNote').textContent = arr.length? `共 ${arr.length} 套，保存在本机浏览器。` : '还没有保存过 BD。';
  ul.innerHTML = arr.map(b=>{
    const n=Object.keys(b.slots||{}).length;
    return `<li><div class="g"><div class="n">${esc(b.name)}</div>
      <div class="s">${esc(b.cls)} · ${n} 件装备 · ${new Date(b.savedAt).toLocaleString()}</div></div>
      <button class="tb" data-load="${b.id}">载入</button>
      <button class="tb danger" data-del="${b.id}">删除</button></li>`;
  }).join('') || '<li style="border:0"><div class="empty">（空）</div></li>';
  openMask('maskMine');
}
document.getElementById('btnMine').addEventListener('click', openMine);
document.getElementById('mineList').addEventListener('click', e=>{
  const l=e.target.closest('[data-load]'), d=e.target.closest('[data-del]');
  if(l){
    const all=loadMine(), b=all[l.dataset.load]; if(!b) return;
    ST=newState(); ST.cls=b.cls; ST.slots=JSON.parse(JSON.stringify(b.slots||{}));
    ST.minion=b.minion||''; ST.presetId=b.presetId||null; ST.name=b.name;
    renderClasses(); renderMinions(); renderAll(); closeMask('maskMine'); toast('已载入：'+b.name);
  }
  if(d){
    const all=loadMine(); delete all[d.dataset.del]; saveMine(all); openMine(); toast('已删除');
  }
});

/* ============ 导入导出 ============ */
function payload(){
  return JSON.stringify({format:'deskrawl-build/1', name:ST.name||'', cls:ST.cls,
    slots:ST.slots, minion:ST.minion, presetId:ST.presetId, exportedAt:new Date().toISOString()}, null, 1);
}
document.getElementById('btnExport').addEventListener('click', ()=>{
  document.getElementById('ioTitle').textContent='导出 BD';
  document.getElementById('ioText').value=payload();
  document.getElementById('ioNote').textContent='复制这段 JSON 保存，或另存为 .json 文件。';
  openMask('maskIO');
});
document.getElementById('btnImport').addEventListener('click', ()=>{
  document.getElementById('ioTitle').textContent='导入 BD';
  document.getElementById('ioText').value='';
  document.getElementById('ioNote').textContent='把之前导出的 JSON 粘贴进来，然后点「应用」。';
  openMask('maskIO');
  setTimeout(()=>document.getElementById('ioText').focus(),60);
});
document.getElementById('ioCopy').addEventListener('click', async ()=>{
  const t=document.getElementById('ioText'); t.select();
  try{ await navigator.clipboard.writeText(t.value); toast('已复制'); }
  catch(e){ document.execCommand('copy'); toast('已复制'); }
});
document.getElementById('ioApply').addEventListener('click', ()=>{
  try{
    const o=JSON.parse(document.getElementById('ioText').value);
    if(!o || !o.slots) throw new Error('缺少 slots 字段');
    ST=newState(); ST.cls=o.cls||'Warrior'; ST.slots=o.slots||{}; ST.minion=o.minion||'';
    ST.presetId=o.presetId||null; ST.name=o.name||'导入的 BD';
    renderClasses(); renderMinions(); renderAll(); closeMask('maskIO');
    toast('导入成功：'+(o.name||''));
  }catch(e){ toast('导入失败：'+e.message); }
});

document.getElementById('btnClear').addEventListener('click', ()=>{
  if(!confirm('清空当前配装？（已保存的 BD 不受影响）')) return;
  ST=newState(); document.getElementById('presetSel').value='';
  renderClasses(); renderMinions(); renderAll(); toast('已清空');
});

/* ============ 模态 / 主题 ============ */
function openMask(id){ document.getElementById(id).classList.add('on'); }
function closeMask(id){ document.getElementById(id).classList.remove('on'); }
document.querySelectorAll('.mask').forEach(m=>{
  m.addEventListener('click', e=>{ if(e.target===m || e.target.closest('[data-close]')) m.classList.remove('on'); });
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') document.querySelectorAll('.mask.on').forEach(m=>m.classList.remove('on')); });

document.getElementById('btnTheme').addEventListener('click', ()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', cur==='dark'?'light':'dark');
});

/* ============ 渲染 ============ */
function renderAll(){
  ST.clsCN = (DB.classes.find(c=>c.key===ST.cls)||{}).cn || '';
  renderSlots();
  renderQchips();
  renderItems();
  document.getElementById('tabAfx').disabled = !ST.slots[curSlot];
  if(curTab==='afx') renderAffixEditor();
  renderTotals();
  renderBdInfo();
}

/* ============ 启动 ============ */
(function init(){
  DB.gearIndex={}; DB.gear.forEach(g=>DB.gearIndex[g.id]=g);
  DB.affixNameIndex={};
  for(const id of Object.keys(DB.affixes)){ const a=DB.affixes[id]; if(a.name) DB.affixNameIndex[a.name]=id; }
  // 攻略里的别名 → 词条 id
  const ALIAS={'魔抗':'MagicResist','强力攻击伤害':'StrongAttackDamage','技能元素伤害':null,'额外生命':'MaxHealthPercent',
    '额外护甲':'ArmorPercent','寒冷伤害':'DamageCold','对精英伤害':'DamageVsElite','对满血敌人伤害':'DamageVsHealthy',
    '对受伤目标伤害':'DamageVsInjured','回血':'LifeRegen','攻击速度':'AttackSpeed','荆棘':'Thorns'};
  for(const [k,v] of Object.entries(ALIAS)) if(v && !DB.affixNameIndex[k]) DB.affixNameIndex[k]=v;

  const def=DB.classes.find(c=>c.key===ST.cls);
  ST.clsCN=def?def.cn:'';
  renderClasses(); renderMinions(); renderPresetSel();
  filters.quals=new Set(QORDER);
  renderAll();

  // 页脚：数据量与口径提示
  const dn=document.getElementById('datanotes');
  if(dn){
    const m=DB.meta||{};
    dn.innerHTML=
      `<b>本页数据</b>：装备 ${DB.gear.length} 件 · 词条 ${Object.keys(DB.affixes).length} 项 · `+
      `仆从 ${DB.minions.length} 个 · 预设 BD ${DB.presets.length} 套 · 图标 ${Object.keys(DB.icons).length} 张（已内嵌，离线可用）`
      + (m.dataNotes&&m.dataNotes.length
        ? '<br><b>口径提示</b>：<br>'+m.dataNotes.map(t=>'· '+esc(t)).join('<br>')
        : '');
  }
})();
</script>
